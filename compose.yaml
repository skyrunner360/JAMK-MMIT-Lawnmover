services:
  db:
    image: postgres:18
    restart: unless-stopped
    ports:
      - '127.0.0.1:${DEV_DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d local']
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
